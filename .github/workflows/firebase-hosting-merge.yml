# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHITCHAT_254BC }}
          channelId: live
          projectId: chitchat-254bc
      # Deploy the push Cloud Function. Non-blocking: this only succeeds once the
      # Firebase project is on the Blaze plan and the service account has the
      # Cloud Functions Developer + Service Account User roles. Until then the
      # hosting deploy above still ships and the build stays green.
      - name: Deploy Cloud Functions
        continue-on-error: true
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project chitchat-254bc --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHITCHAT_254BC }}
